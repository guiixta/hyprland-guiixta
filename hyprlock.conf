background {
    monitor = DVI-D-1
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.6
    fade_on_empty = false
    placeholder_text = Digite a senha...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Cantarell
    position = 0, 150
    halign = center
    valign = center
}

